[project]
name = "point-pilot-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
# Test and dev tools: pip install -e ".[dev]"
dev = [
    # FastAPI's TestClient sends its requests through httpx2 (Starlette 1.10+ deprecates httpx).
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
]

[project.scripts]
dev = "app.cli:dev"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]