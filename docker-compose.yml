# Local development services. The API and Vite run natively; only Postgres runs here.
# Redis and the worker are added in Phase 1b.
services:
  postgres:
    image: postgres:16
    environment:
      # Superuser, used only by the init script below. The app never logs in as this.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Bound to localhost only, so the dev passwords are never reachable from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
