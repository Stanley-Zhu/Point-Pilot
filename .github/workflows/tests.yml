# Runs the API's migrations check and pytest suite against a throwaway Postgres.
# Required to pass before a PR can merge into main (set in the repo's branch ruleset).
name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Wait until Postgres accepts connections before the steps start.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 10

    env:
      # The same dev-only credentials as api/.env.example; this database lives only for this run.
      DATABASE_URL: postgresql+psycopg://pointpilot_admin:admin_dev@127.0.0.1:5432/pointpilot
      MIGRATION_DATABASE_URL: postgresql+psycopg://pointpilot_owner:owner_dev@127.0.0.1:5432/pointpilot
      TEST_DATABASE_URL: postgresql+psycopg://pointpilot_admin:admin_dev@127.0.0.1:5432/pointpilot_test
      TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://pointpilot_owner:owner_dev@127.0.0.1:5432/pointpilot_test

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: api/requirements.txt

      # Service containers start before checkout, so the init script cannot be mounted
      # the way docker-compose.yml does it; run it here instead.
      - name: Create roles and databases
        # ON_ERROR_STOP makes a failed statement fail the step, instead of psql exiting 0.
        run: psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f ../docker/postgres-init.sql
        env:
          PGPASSWORD: postgres

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Migrations match the models
        run: |
          alembic upgrade head
          alembic check

      - name: Tests
        run: pytest
